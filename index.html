<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f7891">
  <title>NS業務アシスト 操作マニュアル</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173042;background:#edf5f7}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left));background:linear-gradient(155deg,#e6f5f4 0%,#eef5fb 55%,#f8fafc 100%)}
    main{width:min(100%,640px);padding:clamp(28px,8vw,56px) clamp(22px,7vw,48px);text-align:center;background:#fff;border:1px solid #cde0e5;border-radius:24px;box-shadow:0 18px 48px rgba(23,48,66,.12)}
    .mark{width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(145deg,#0d8c8b,#176ca8);color:#fff;box-shadow:0 10px 24px rgba(13,140,139,.24)}
    .mark svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    h1{margin:0;font-size:clamp(27px,8vw,42px);line-height:1.25;letter-spacing:.02em}
    h1 span{display:block;margin-top:8px;font-size:.65em;color:#176ca8}
    p{margin:26px 0 0;color:#5b6f7c;font-size:clamp(16px,4.5vw,19px);line-height:1.8}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11a2 2 0 0 1 2 2v15a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17a2 2 0 0 1 2-2h2.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg>
    </div>
    <h1>NS業務アシスト<span>操作マニュアル</span></h1>
    <p>現在、操作マニュアルを準備中です。</p>
  </main>
</body>
</html>
